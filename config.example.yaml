# ───────────────────────────────────────────────────────────────
# 키움 조건검색 알림 — 동작 설정
# 이 파일을 복사해서 "config.yaml" 로 저장한 뒤 원하는 대로 수정하세요.
#   (Windows) copy config.example.yaml config.yaml
#   (mac/Linux) cp config.example.yaml config.yaml
# config.yaml 은 개인 설정이라 .gitignore 로 제외됩니다.
# ───────────────────────────────────────────────────────────────

# 접속 환경: real(실전) / mock(모의투자)
#  - 처음에는 mock 으로 테스트한 뒤 real 로 바꾸는 것을 권장합니다.
environment: mock

# 알림을 받을 조건식 이름 목록.
#  - 키움 HTS/영웅문에서 "서버 저장" 해둔 조건식의 이름과 정확히 일치해야 합니다.
#  - 여기에 적은 조건식만 실시간 감시합니다. 줄을 추가/삭제해서 켜고 끌 수 있습니다.
#  - 빈 목록으로 두면 서버에 저장된 "모든" 조건식을 감시합니다.
conditions:
  - 데드크로스 알리미
  # - 골든크로스 알리미
  # - 20일선 돌파

# 어떤 신호에 알림을 보낼지: insert(편입) / delete(이탈)
#  - 편입만 받고 싶으면 [insert] 로 두세요.
notify_on:
  - insert
  - delete

# 종목코드와 함께 종목명도 표시할지 여부 (키움 REST 로 1회 조회 후 캐시).
#  - 조회 실패해도 알림은 종목코드로 정상 전송됩니다.
resolve_stock_name: true

# 시작/종료 시 텔레그램으로 상태 메시지를 보낼지 여부.
notify_lifecycle: true

# ── 웹 대시보드(dashboard.py) 전용 설정 ─────────────────────────
# 관심종목: 대시보드에서 ★ 로 강조하고, 각 종목이 현재 어떤 조건식에 편입돼
#           있는지 따로 보여줍니다. "코드 이름" 또는 "코드"만 적어도 됩니다.
watchlist:
  - "005930 삼성전자"
  - "000660 SK하이닉스"
  # - "035720"          # 이름 생략 시 실시간 조회로 채워집니다

# 대시보드 웹서버 포트 (브라우저에서 http://localhost:8765 로 접속)
dashboard_port: 8765
