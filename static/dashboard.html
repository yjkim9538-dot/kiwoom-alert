<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키움 조건검색 실시간 현황</title>
<style>
  :root {
    --bg:#0f1117; --panel:#181b24; --panel2:#1f2330; --line:#2a2f3d;
    --txt:#e6e9ef; --dim:#8b93a7; --ins:#2ecc71; --del:#ff6b6b;
    --watch:#ffd166; --accent:#4d9fff;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  header {
    display:flex; align-items:center; gap:14px; padding:14px 20px;
    background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;
  }
  header h1 { font-size:18px; margin:0; }
  .pill { font-size:12px; padding:3px 9px; border-radius:99px; background:var(--panel2); color:var(--dim); }
  .pill.real { background:#3a1f1f; color:#ff8a8a; }
  .pill.mock { background:#1f2e3a; color:#7fc4ff; }
  #conn { margin-left:auto; }
  #conn.ok { color:var(--ins); } #conn.bad { color:var(--del); }
  .wrap { display:grid; grid-template-columns: 1fr 360px; gap:16px; padding:16px 20px; }
  @media (max-width:1000px){ .wrap{ grid-template-columns:1fr; } }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 10px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card .hd { display:flex; align-items:center; justify-content:space-between; padding:11px 14px; background:var(--panel2); }
  .card .hd .nm { font-weight:600; }
  .card .hd .cnt { font-size:13px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .members { list-style:none; margin:0; padding:6px 0; max-height:320px; overflow:auto; }
  .members li { display:flex; justify-content:space-between; gap:8px; padding:6px 14px; font-size:14px; }
  .members li.watch { background:rgba(255,209,102,.08); }
  .members .stk { display:flex; gap:7px; align-items:center; min-width:0; }
  .members .star { color:var(--watch); }
  .members .code { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .members .since { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .empty { padding:14px; color:var(--dim); font-size:13px; }
  aside { display:flex; flex-direction:column; gap:16px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .wl { list-style:none; margin:0; padding:0; }
  .wl li { padding:9px 0; border-bottom:1px solid var(--line); }
  .wl li:last-child { border-bottom:0; }
  .wl .top { display:flex; gap:8px; align-items:baseline; }
  .wl .nm { font-weight:600; } .wl .code { color:var(--dim); font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .chip { font-size:11px; padding:2px 8px; border-radius:99px; background:#22351f; color:var(--ins); }
  .chip.none { background:var(--panel2); color:var(--dim); }
  .feed { list-style:none; margin:0; padding:0; max-height:520px; overflow:auto; }
  .feed li { display:flex; gap:9px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .feed .t { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; min-width:62px; }
  .feed .badge { font-size:11px; padding:1px 7px; border-radius:5px; font-weight:700; }
  .feed .badge.I { background:rgba(46,204,113,.15); color:var(--ins); }
  .feed .badge.D { background:rgba(255,107,107,.15); color:var(--del); }
  .feed .star { color:var(--watch); }
  .feed .cond { color:var(--dim); }
  .flash { animation:flash 1s ease-out; }
  @keyframes flash { from{ background:rgba(77,159,255,.25);} to{ background:transparent;} }
</style>
</head>
<body>
<header>
  <h1>📡 키움 조건검색 실시간 현황</h1>
  <span class="pill" id="env">-</span>
  <span class="pill" id="condcount">조건 0</span>
  <span id="conn" class="bad">● 연결 끊김</span>
</header>

<div class="wrap">
  <main>
    <h2>조건식별 편입 종목</h2>
    <div class="cards" id="cards"><div class="empty">데이터를 기다리는 중…</div></div>
  </main>
  <aside>
    <div class="box">
      <h2>관심종목 현황</h2>
      <ul class="wl" id="watchlist"><li class="empty">관심종목이 설정되지 않았습니다.</li></ul>
    </div>
    <div class="box">
      <h2>실시간 이벤트</h2>
      <ul class="feed" id="feed"><li class="empty">아직 이벤트가 없습니다.</li></ul>
    </div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
let conditions = [], watchlist = [], feed = [];

function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderEnv(env){
  const el = $('env');
  el.textContent = env==='real' ? '실전 (real)' : '모의 (mock)';
  el.className = 'pill ' + (env==='real'?'real':'mock');
}
function renderConditions(){
  $('condcount').textContent = '조건 ' + conditions.length;
  const root = $('cards');
  if(!conditions.length){ root.innerHTML = '<div class="empty">등록된 조건식이 없습니다.</div>'; return; }
  root.innerHTML = conditions.map(c => {
    const rows = c.members.length ? c.members.map(m => `
      <li class="${m.watch?'watch':''}">
        <span class="stk">${m.watch?'<span class="star">★</span>':''}
          <span>${esc(m.name)||'&nbsp;'}</span>
          <span class="code">${esc(m.code)}</span></span>
        <span class="since">${esc(m.since)}</span>
      </li>`).join('') : '<li class="empty">편입 종목 없음</li>';
    return `<div class="card">
      <div class="hd"><span class="nm">${esc(c.name)}</span><span class="cnt">${c.count} 종목</span></div>
      <ul class="members">${rows}</ul></div>`;
  }).join('');
}
function renderWatchlist(){
  const root = $('watchlist');
  if(!watchlist.length){ root.innerHTML = '<li class="empty">관심종목이 설정되지 않았습니다.</li>'; return; }
  root.innerHTML = watchlist.map(w => {
    const chips = w.conditions.length
      ? w.conditions.map(c=>`<span class="chip">${esc(c)}</span>`).join('')
      : '<span class="chip none">편입된 조건 없음</span>';
    return `<li>
      <div class="top"><span class="nm">${esc(w.name)||esc(w.code)}</span><span class="code">${esc(w.code)}</span></div>
      <div class="chips">${chips}</div></li>`;
  }).join('');
}
function renderFeed(){
  const root = $('feed');
  if(!feed.length){ root.innerHTML = '<li class="empty">아직 이벤트가 없습니다.</li>'; return; }
  root.innerHTML = feed.slice(0,200).map((e,i) => `
    <li class="${i===0?'flash':''}">
      <span class="t">${esc(e.time)}</span>
      <span class="badge ${e.signal}">${e.signal==='I'?'편입':'이탈'}</span>
      ${e.watch?'<span class="star">★</span>':''}
      <span>${esc(e.name)||esc(e.code)}</span>
      <span class="cond">· ${esc(e.condition)}</span>
    </li>`).join('');
}

function applySnapshot(s){
  renderEnv(s.environment);
  conditions = s.conditions||[]; watchlist = s.watchlist||[]; feed = s.events||[];
  renderConditions(); renderWatchlist(); renderFeed();
}
function applyUpdate(u){
  if(u.conditions) conditions = u.conditions;
  if(u.watchlist) watchlist = u.watchlist;
  renderConditions(); renderWatchlist();
  if(u.event){ feed.unshift(u.event); if(feed.length>200) feed.pop(); renderFeed(); }
}

function connect(){
  const es = new EventSource('/events');
  es.onopen = () => { const c=$('conn'); c.className='ok'; c.textContent='● 실시간 연결됨'; };
  es.onerror = () => { const c=$('conn'); c.className='bad'; c.textContent='● 재연결 중…'; };
  es.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch(e){ return; }
    if(msg.type==='snapshot') applySnapshot(msg);
    else if(msg.type==='update') applyUpdate(msg);
    else if(msg.type==='status'){ /* 상태 메시지는 콘솔에만 */ console.log(msg.text); }
  };
}
connect();
</script>
</body>
</html>
