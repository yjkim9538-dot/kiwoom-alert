<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키움 조건검색 실시간 현황 — 데모(샘플)</title>
<style>
  :root {
    --bg:#0f1117; --panel:#181b24; --panel2:#1f2330; --line:#2a2f3d;
    --txt:#e6e9ef; --dim:#8b93a7; --ins:#2ecc71; --del:#ff6b6b;
    --watch:#ffd166; --accent:#4d9fff;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  header {
    display:flex; align-items:center; gap:14px; padding:14px 20px;
    background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;
  }
  header h1 { font-size:18px; margin:0; }
  .pill { font-size:12px; padding:3px 9px; border-radius:99px; background:var(--panel2); color:var(--dim); }
  .pill.demo { background:#3a2f1f; color:#ffd166; }
  .pill.mock { background:#1f2e3a; color:#7fc4ff; }
  #conn { margin-left:auto; color:var(--watch); }
  .demobar { background:#2a230f; color:#ffd166; font-size:13px; padding:8px 20px; border-bottom:1px solid var(--line); }
  .wrap { display:grid; grid-template-columns: 1fr 360px; gap:16px; padding:16px 20px; }
  @media (max-width:1000px){ .wrap{ grid-template-columns:1fr; } }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 10px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card .hd { display:flex; align-items:center; justify-content:space-between; padding:11px 14px; background:var(--panel2); }
  .card .hd .nm { font-weight:600; }
  .card .hd .cnt { font-size:13px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .members { list-style:none; margin:0; padding:6px 0; max-height:320px; overflow:auto; }
  .members li { display:flex; justify-content:space-between; gap:8px; padding:6px 14px; font-size:14px; }
  .members li.watch { background:rgba(255,209,102,.08); }
  .members .stk { display:flex; gap:7px; align-items:center; min-width:0; }
  .members .star { color:var(--watch); }
  .members .code { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .members .since { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .empty { padding:14px; color:var(--dim); font-size:13px; }
  aside { display:flex; flex-direction:column; gap:16px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .wl { list-style:none; margin:0; padding:0; }
  .wl li { padding:9px 0; border-bottom:1px solid var(--line); }
  .wl li:last-child { border-bottom:0; }
  .wl .top { display:flex; gap:8px; align-items:baseline; }
  .wl .nm { font-weight:600; } .wl .code { color:var(--dim); font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .chip { font-size:11px; padding:2px 8px; border-radius:99px; background:#22351f; color:var(--ins); }
  .chip.none { background:var(--panel2); color:var(--dim); }
  .feed { list-style:none; margin:0; padding:0; max-height:520px; overflow:auto; }
  .feed li { display:flex; gap:9px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .feed .t { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; min-width:62px; }
  .feed .badge { font-size:11px; padding:1px 7px; border-radius:5px; font-weight:700; }
  .feed .badge.I { background:rgba(46,204,113,.15); color:var(--ins); }
  .feed .badge.D { background:rgba(255,107,107,.15); color:var(--del); }
  .feed .star { color:var(--watch); }
  .feed .cond { color:var(--dim); }
  .flash { animation:flash 1s ease-out; }
  @keyframes flash { from{ background:rgba(77,159,255,.25);} to{ background:transparent;} }
</style>
</head>
<body>
<header>
  <h1>📡 키움 조건검색 실시간 현황</h1>
  <span class="pill demo">데모 · 샘플 데이터</span>
  <span class="pill mock" id="env">모의 (mock)</span>
  <span id="conn">● 데모 모드 (자동 시뮬레이션)</span>
</header>
<div class="demobar">
  실제 키움 연결 없이 화면 모습만 보여주는 데모입니다. 몇 초마다 편입/이탈이 자동 발생합니다.
  실제 사용 시에는 <b>dashboard.py</b> 실행 후 브라우저로 <b>http://localhost:8765</b> 접속하면
  이 화면이 본인 키움 조건식 데이터로 실시간 갱신됩니다.
</div>

<div class="wrap">
  <main>
    <h2>조건식별 편입 종목</h2>
    <div class="cards" id="cards"></div>
  </main>
  <aside>
    <div class="box">
      <h2>관심종목 현황</h2>
      <ul class="wl" id="watchlist"></ul>
    </div>
    <div class="box">
      <h2>실시간 이벤트</h2>
      <ul class="feed" id="feed"></ul>
    </div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function nowt(){ const d=new Date(); return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':'); }

// ── 샘플 상태 ─────────────────────────────────────────────
const WATCH = { '005930':'삼성전자', '000660':'SK하이닉스', '035720':'카카오' };
let conditions = [
  { name:'데드크로스 알리미', members:[
      {code:'000660', name:'SK하이닉스', since:'09:12:07', watch:true},
      {code:'068270', name:'셀트리온',   since:'09:21:33', watch:false},
  ]},
  { name:'골든크로스 알리미', members:[
      {code:'005930', name:'삼성전자', since:'09:05:41', watch:true},
      {code:'207940', name:'삼성바이오로직스', since:'09:18:02', watch:false},
  ]},
  { name:'20일선 돌파', members:[
      {code:'035720', name:'카카오', since:'09:30:55', watch:true},
  ]},
];
let feed = [
  {time:'09:30:55', signal:'I', code:'035720', name:'카카오', condition:'20일선 돌파', watch:true},
  {time:'09:21:33', signal:'I', code:'068270', name:'셀트리온', condition:'데드크로스 알리미', watch:false},
];

function watchlistPayload(){
  return Object.entries(WATCH).map(([code,name])=>({
    code, name,
    conditions: conditions.filter(c=>c.members.some(m=>m.code===code)).map(c=>c.name)
  }));
}
function renderConditions(){
  conditions.forEach(c=>c.count=c.members.length);
  $('cards').innerHTML = conditions.map(c=>{
    const rows = c.members.length ? c.members.slice().sort((a,b)=>(a.watch===b.watch?0:a.watch?-1:1)).map(m=>`
      <li class="${m.watch?'watch':''}">
        <span class="stk">${m.watch?'<span class="star">★</span>':''}
          <span>${esc(m.name)}</span><span class="code">${esc(m.code)}</span></span>
        <span class="since">${esc(m.since)}</span></li>`).join('')
      : '<li class="empty">편입 종목 없음</li>';
    return `<div class="card"><div class="hd"><span class="nm">${esc(c.name)}</span>
      <span class="cnt">${c.members.length} 종목</span></div>
      <ul class="members">${rows}</ul></div>`;
  }).join('');
}
function renderWatchlist(){
  $('watchlist').innerHTML = watchlistPayload().map(w=>{
    const chips = w.conditions.length
      ? w.conditions.map(c=>`<span class="chip">${esc(c)}</span>`).join('')
      : '<span class="chip none">편입된 조건 없음</span>';
    return `<li><div class="top"><span class="nm">${esc(w.name)}</span>
      <span class="code">${esc(w.code)}</span></div><div class="chips">${chips}</div></li>`;
  }).join('');
}
function renderFeed(){
  $('feed').innerHTML = feed.slice(0,200).map((e,i)=>`
    <li class="${i===0?'flash':''}"><span class="t">${esc(e.time)}</span>
      <span class="badge ${e.signal}">${e.signal==='I'?'편입':'이탈'}</span>
      ${e.watch?'<span class="star">★</span>':''}
      <span>${esc(e.name)}</span><span class="cond">· ${esc(e.condition)}</span></li>`).join('');
}
function renderAll(){ renderConditions(); renderWatchlist(); renderFeed(); }
renderAll();

// ── 라이브 시뮬레이션 ──────────────────────────────────────
const POOL = [
  {code:'005930', name:'삼성전자'}, {code:'000660', name:'SK하이닉스'},
  {code:'035720', name:'카카오'}, {code:'051910', name:'LG화학'},
  {code:'006400', name:'삼성SDI'}, {code:'105560', name:'KB금융'},
  {code:'005380', name:'현대차'}, {code:'373220', name:'LG에너지솔루션'},
];
function tick(){
  const c = conditions[Math.floor(Math.random()*conditions.length)];
  const insert = Math.random() < 0.6 || c.members.length===0;
  let stk, signal;
  if(insert){
    const cand = POOL.filter(p=>!c.members.some(m=>m.code===p.code));
    if(!cand.length) return;
    stk = cand[Math.floor(Math.random()*cand.length)]; signal='I';
    c.members.push({code:stk.code, name:stk.name, since:nowt(), watch:!!WATCH[stk.code]});
  } else {
    const m = c.members[Math.floor(Math.random()*c.members.length)];
    stk = {code:m.code, name:m.name}; signal='D';
    c.members = c.members.filter(x=>x.code!==m.code);
  }
  feed.unshift({time:nowt(), signal, code:stk.code, name:stk.name, condition:c.name, watch:!!WATCH[stk.code]});
  if(feed.length>200) feed.pop();
  renderAll();
}
setInterval(tick, 3500);
</script>
</body>
</html>
